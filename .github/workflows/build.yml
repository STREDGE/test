name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: AML (NDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone AndroidModLoader (MIT)
        run: |
          git clone --depth 1 --recursive --shallow-submodules https://github.com/RusJJ/AndroidModLoader.git native/build/aml
          git -C native/build/aml log -1 --format='AML commit %H %cd'

      # Upstream собирает на NDK r24 (новые NDK ругаются на -mfloat-abi для arm64).
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r24

      - name: Build libAML.so
        working-directory: native/build/aml
        run: |
          # Как в их build.ps1: сначала ARMPatch (кладёт libarmpatch.a в obj/local/<abi>/), потом AML.
          NDK="${{ steps.ndk.outputs.ndk-path }}/ndk-build"
          "$NDK" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./ARMPatch/armpatch_src/Android.mk NDK_APPLICATION_MK=./ARMPatch/armpatch_src/Application.mk NDK_DEBUG=0 -j"$(nproc)"
          "$NDK" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk NDK_DEBUG=0 -j"$(nproc)"
          find libs -name '*.so' -exec ls -la {} \;

      - name: Collect payload
        run: |
          mkdir -p payload
          for abi in arm64-v8a armeabi-v7a; do
            if [ -f "native/build/aml/libs/$abi/libAML.so" ]; then
              mkdir -p "payload/$abi"
              cp "native/build/aml/libs/$abi/libAML.so" "payload/$abi/"
            fi
          done
          find payload -type f

      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: payload
          if-no-files-found: error

  app:
    name: Tests + APK
    needs: native
    # APK собираем, даже если AML не собрался (тогда кнопка AML в менеджере просто неактивна).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # публикация APK в релиз «latest»
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: payload
          path: app/build/payload-assets/payload

      - name: Unit tests (IMG, моды, патчер)
        run: ./gradlew --no-daemon :modcore:test :patcher:test

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            modcore/build/reports/tests
            patcher/build/reports/tests

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/SA-Mod-Manager-${GITHUB_SHA::7}.apk"
          ls -la out

      - name: Check APK contents
        run: |
          apk=$(ls out/*.apk)
          unzip -l "$apk" | grep -E 'payload/|classes' || true
          # Мост должен быть в dex менеджера — его патчер копирует в игру.
          unzip -p "$apk" 'classes*.dex' | grep -aq 'Lsamm/bridge/Bridge;' && echo "bridge: OK"
          unzip -p "$apk" 'classes*.dex' | grep -aq 'Lsamm/bridge/BridgeProvider;' && echo "provider: OK"
          if unzip -l "$apk" | grep -q 'assets/payload/arm64-v8a/libAML.so'; then echo "AML arm64: OK"; else echo "::warning::AML не попал в APK"; fi
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$apk" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: SA-Mod-Manager-apk
          path: out/*.apk
          if-no-files-found: error

      # Прямая ссылка без входа в GitHub и без zip:
      # https://github.com/STREDGE/test/releases/download/latest/SA-Mod-Manager.apk
      - name: Prepare release file
        if: github.ref_name == 'ccr-476936e2-u3ff6o' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p release
          cp out/*.apk release/SA-Mod-Manager.apk
          cat > release/notes.md <<EOF
          Последняя сборка SA Mod Manager (коммит ${GITHUB_SHA::7}).

          **Установка:** нажмите на SA-Mod-Manager.apk ниже → «Скачать» → откройте файл → разрешите установку из этого источника.
          EOF

      - name: Publish to release "latest"
        if: github.ref_name == 'ccr-476936e2-u3ff6o' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: SA Mod Manager (последняя сборка)
          body_path: release/notes.md
          prerelease: true
          make_latest: true
          overwrite_files: true
          files: release/SA-Mod-Manager.apk
